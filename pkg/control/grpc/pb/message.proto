// 注意设置go环境变量中的架构和系统为本地系统，然后安装如下两个插件
// go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
// go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
// 检查安装情况
// protoc-gen-go --version
// protoc-gen-go-grpc --version
// 运行生成代码
// protoc --go_out=. --go_opt=paths=source_relative --go-grpc_out=. --go-grpc_opt=paths=source_relative pkg/control/grpc/pb/message.proto

// twirp
// go install github.com/twitchtv/twirp/protoc-gen-twirp@latest
// go install github.com/golang/protobuf/protoc-gen-go@latest // 过时 推荐使用下方
// google.golang.org/protobuf/cmd/protoc-gen-go@latest
// 在message.proto 文件夹下执行
// protoc --twirp_out=. --go_out=. ./message.proto
// https://github.com/twitchtv/twirp
syntax = "proto3";


package pb;

option go_package = "pkg/control/grpc/pb";

service MessageService {
  // 双向流 RPC（用于大请求 + 大响应）
  rpc SendMessageBidi (stream Chunk) returns (stream Chunk) {}
}

message BaseRequest {
  string message_type = 1;
  string client_id = 2;
  bytes message_body = 3;
}

message BaseResponse {
  bool success = 1;
  int32 response_code = 2;
  string response_message = 3;
  bytes message = 4;
}


// meta 信息（用于在流内传输响应的元信息）
message Meta {
  bool success = 1;
  int32 response_code = 2;
  string response_message = 3;
}

// 流分块，oneof 用于区分是数据块还是 meta 控制块
message Chunk {
  string message_type = 1;
  string client_id = 2;
  int32 seq = 3;  // 序号（可用于校验）
  bool last = 4;  // 本方向最后一块

  //  oneof 控制data meta 只能有一个存在
  oneof payload {
    bytes data = 5; // 普通数据分片
    Meta meta = 6;  // meta 控制块（通常用于服务端先发送响应状态）
  }
}
