datasource:
  enabled: true
  data_source_type: mysql
  db_username: myself
  db_password: myself_pw
  db_host: localhost
  db_name: myself_example
  db_port: 3306
  db_path: ./db/gm-fabric.db
  max_idle_conn: 10
  max_open_conn: 50
  log_in_console: true
docker:
  enabled: true
  host: unix:///var/run/docker.sock
  default_timeout: 5
grpc:
  enabled: true
  server:
    host: 0.0.0.0:65534
    max_recv_msg_size: 5242880
    max_send_msg_size: 5242880
    chunk_size: 4194304
    tls_enabled: true
    tls_cert_file: ./certs/gserver.crt
    tls_key_file: ./certs/gserver.key
    tls_rca_cert_file: ./certs/root-ca.crt
  client:
    host: 192.168.58.110:65533
    max_call_recv_msg_size: 5242880
    max_call_send_msg_size: 5242880
    chunk_size: 4194304
    call_timeout: 99999
    tls_enabled: true
    tls_cert_file: ./certs/gclient.crt
    tls_key_file: ./certs/gclient.key
    tls_rca_cert_file: ./certs/root-ca.crt
http:
  enabled: true
  address: :8080
  context_path: example
  # 可选 debug release
  run_mode: debug
  tls_enabled: true
  tls_cert_file: ./certs/hserver.crt
  tls_key_file: ./certs/hserver.key
libp2p:
  enabled: true
  listen_addr:
    - /ip4/0.0.0.0/tcp/2000
    - /ip6/::1/tcp/2000
    - /ip4/0.0.0.0/udp/2000/quic-v1
    - /ip4/127.0.0.1/udp/2000/quic-v1
    - /ip4/0.0.0.0/udp/2000/quic-v1/webtransport
    - /ip4/0.0.0.0/udp/2000/webrtc-direct
    - /dns4/localhost/udp/2000/ws
  identity:
    peer_id: 12D3KooWEeXfZpxfqwxFLJ2JYH21x85DnTMnCnmfUs4yQnCngM5T
    privkey: CAESQJY27DDSC9bEnAfcOE+rCLV6OVm/AETqUCt1swmR7HD9R8VdYQoGM7931nd+BX/URL1JLEGRvXX8IkGCK+boblo=
  protocol_id: /gm-fabric/chat/1.0.0
  service_tag: gm-fabric-deployment
  bootstrap_list:
  #- "dns4/127.0.0.1/udp/2000/quic-v1/p2p/12D3KooWEmsdj6kGx8cpcjZWd4QG4bh4FZGuBEiUULWRgScyNHwe"
logger:
  default_log_level: debug
  stack_log_level: fatal
  print_format: console
  file_path: ./logs/app.log
  max_age: 7
  rotation_time: 1
  logger_level:
    grpc: debug
    libp2p: info
    main: info
