datasource:
  enabled: false
  data_source_type: sqlite3
  db_username: username
  db_password: password
  db_host: localhost
  db_port: 3306
  db_name: db_name
  db_path: db/golang-example.db
  max_idle_conn: 10
  max_open_conn: 50
  log_in_console: true
  tls_enabled: false
  tls_cert_file: certs/openssl/mysqlclient.crt
  tls_key_file: certs/openssl/mysqlclient.key
  tls_ca_file: certs/openssl/root.crt
  tls_skip_verify: false
  tls_server_name: mysql
docker:
  enabled: false
  host: unix:///var/run/docker.sock
  api_version: ""
  tls_enabled: false
  tls_cert_file: certs/openssl/dclient.crt
  tls_key_file: certs/openssl/dclient.key
  tls_ca_file: certs/openssl/docker-authority.crt
  default_timeout: 5
grpc:
  enabled: false
  server:
    host: 127.0.0.1:65534
    max_recv_msg_size: 5242880
    max_send_msg_size: 5242880
    chunk_size: 4194304
    tls_enabled: true
    tls_gm: true
    tls_cert_file: "certs/tongsuo/server_sign.crt,certs/tongsuo/server_enc.crt"
    tls_key_file: "certs/tongsuo/server_sign.key,certs/tongsuo/server_enc.key"
    tls_rca_cert_file: "certs/tongsuo/subca.crt"
    # tls_cert_file: certs/normal/gserver.crt
    # tls_key_file: certs/normal/gserver.key
    # tls_rca_cert_file: certs/normal/root-ca.crt
  client:
    host: 127.0.0.1:65533
    max_call_recv_msg_size: 5242880
    max_call_send_msg_size: 5242880
    chunk_size: 4194304
    call_timeout: 99999
    tls_enabled: true
    tls_gm: true
    tls_cert_file: "certs/tongsuo/client_sign.crt,certs/tongsuo/client_enc.crt"
    tls_key_file: "certs/tongsuo/client_sign.key,certs/tongsuo/client_enc.key"
    tls_rca_cert_file: "certs/tongsuo/subca.crt"
    tls_server_name: "grpc"
    # tls_cert_file: certs/normal/gclient.crt
    # tls_key_file: certs/normal/gclient.key
    # tls_rca_cert_file: certs/normal/root-ca.crt
http:
  enabled: false
  address: :8080
  context_path: example
  run_mode: release
  tls_enabled: true
  tls_gm: true
  # 国密TLS是否使用单证书模式，默认false（使用双证书模式：一个用于签名，一个用于加密）
  tls_gm_single_cert: false
  # gm模式需要两套 签名密钥,加密密钥
  # tls_key_file: "certs/tjfoc/sm2_sign_key.pem,certs/tjfoc/sm2_enc_key.pem"
  # gm模式需要两套 签名证书,加密证书
  # tls_cert_file: "certs/tjfoc/sm2_sign_cert.cer,certs/tjfoc/sm2_enc_cert.cer"
  # tls_rca_cert_file: certs/tjfoc/SM2_CA.cer
  tls_cert_file: "certs/tongsuo/server_sign.crt,certs/tongsuo/server_enc.crt"
  tls_key_file: "certs/tongsuo/server_sign.key,certs/tongsuo/server_enc.key"
  tls_rca_cert_file: "certs/tongsuo/subca.crt"
  http2_enabled: true  # 国密TLS模式不支持HTTP/2
  pprof: true
  language: "zh"  # 默认语言设置，优先使用请求携带的header中的accept-language 如果没有 会采用这里的 支持zh,en
  upload_dir: "uploads"
  # IP白名单配置
  ip_white_list:
    enabled: false
    ips: [ "127.0.0.1", "192.168.1.0/24" ]
  # IP黑名单配置
  ip_black_list:
    enabled: false
    ips: [ "10.0.0.1", "172.16.0.0/16" ]
  # 限流配置
  rate_limit:
    enabled: true
    rps: 100       # 每秒请求数限制
    burst: 200     # 令牌桶突发大小
    type: "juju"   # 限流实现类型：time, ulule, ants, custom, juju
libp2p:
  enabled: false
  listen_addr:
    - /ip4/0.0.0.0/tcp/2000
    - /ip6/::1/tcp/2000
    - /ip4/0.0.0.0/udp/2000/quic-v1
    - /ip4/127.0.0.1/udp/2000/quic-v1
    - /ip4/0.0.0.0/udp/2000/quic-v1/webtransport
    - /ip4/0.0.0.0/udp/2000/webrtc-direct
    - /dns4/localhost/udp/2000/ws
  identity:
    peer_id: 12D3KooWEeXfZpxfqwxFLJ2JYH21x85DnTMnCnmfUs4yQnCngM5T
    privkey: CAESQJY27DDSC9bEnAfcOE+rCLV6OVm/AETqUCt1swmR7HD9R8VdYQoGM7931nd+BX/URL1JLEGRvXX8IkGCK+boblo=
  protocol_id: /golang-example/msg/1.0.0
  service_tag: golang-example_tags
  bootstrap_list:
  #- /ip4/127.0.0.1/tcp/2000/p2p/12D3KooWAiFrSLkqdaz4KC423i7ZgRks8xjrR1CbjnjJ39f8V1f6
logger:
  default_log_level: debug
  stack_log_level: fatal
  # 输出格式 (date level xxx) => console  ({"date":"","level":"info"}) => json
  print_format: console
  file_path: logs/app.log
  max_age: 7
  rotation_time: 1
  logger_level:
    grpc: debug
    libp2p: info
    main: info
captcha:
  enabled: false
  max_age: 300  # 验证码有效期5分钟
  width: 240    # 验证码图片宽度
  height: 80    # 验证码图片高度
  max_skew: 0.7 # 最大倾斜度
  dot_count: 20 # 干扰点数量
  line_count: 3 # 干扰线数量
  default_type: "number" # 默认验证码类型：string, number, math, chinese
ants_pool:
  enabled: false
  # 线程池大小
  pool_size: 8
  # 最大线程池
  max_pool_size: 16
  # 工作协程过期时间
  expiry_duration: 60
  # 是否预分配工作协程
  pre_alloc: true
  # 是否非阻塞模式
  nonblocking: true
mfa:
  enabled: false
  # google microsoft
  default_provider: "google"
  google:
    issuer: "golang-example"
  microsoft:
    tenant_id: ""
    client_id: ""
    client_secret: ""
# KvDatabase配置示例
kvdatabase:
  # 是否启用KvDatabase功能
  enabled: false
  # 数据库类型: leveldb, pebble, badger4
  db_type: "leveldb"
  # 数据库文件存储路径
  db_path: "./data/kvdatabase"
webrtc:
  enabled: false
  #listen_addr: ""
  ice_servers:
    - url: "stun:stun.l.google.com:19302"
      username: ""
      password: ""
    - url: "turn:turn.example.com:3478"
      username: "user"
      password: "password"
  #max_message_size: 1
  min_port: 50000
  max_port: 65500
  log_in_console: true
ipfs:
  enabled: false
  gateway_address: "127.0.0.1:8080"
  api_address: "/ip4/127.0.0.1/tcp/5001"
email:
  enabled: false
  smtp_host: ""
  smtp_port: 467
  username: ""
  password: ""
  sender_address: ""
  sender_name: ""
  tls_enabled: false
  debug: true
fabric_ca:
  image_name: ""
  ca_name: ""
  enabled_tls: false
  ca_admin_user: "admin"
  ca_admin_password: "adminpw"
  ca_server_port: 7054
  join_docker_network: ""
  docker_network_ip_addr: ""
  local_abs_path: ""
  log_in_console: false
  test_mode: true
authz:
  enabled: false
  model_file: ""
  policy_file: ""
  auto_create_file: ""
  default_allow: ""
  log_enabled: false
tracer:
  enabled: false
  service_name: "example-server"
  log_in_console: true
  # tracer配置
  tracer:
    # file otlp stdout none  zipkin
    exporters: "file,none,otlp,"
    # grpc http/protobuf
    otel_protocol: "grpc"
    # grpc: https://127.0.0.1:4317/v1/traces || 127.0.0.1:4317
    # http/protobuf: 127.0.0.1:4318 ||
    otel_endpoint: "http://127.0.0.1:4317/v1/traces"
    otel_insecure: true
    # zipkin: http://localhost:9411/api/v2/spans
    zipkin_endpoint: ""
    file_path: "tracer.json"
  # logger配置
  logger:
    exporters: "file,none,,"
    otel_protocol: "grpc"
    otel_endpoint: "http://127.0.0.1:4317/v1/logs"
    otel_insecure: true
    file_path: "logger.json"
  # meter配置
  meter:
    exporters: "file,none,,"
    otel_protocol: "grpc"
    otel_endpoint: "http://127.0.0.1:4317/v1/metrics"
    otel_insecure: true
    file_path: "meter.json"
ipfs_cluster:
  enabled: false
  # roundrobin failover
  strategy: "roundrobin"
  timeout_interval: 60
  log_level: "info"
  retries: 5
  addresses:
    - host: "127.0.0.1"
      port: 9094
      user_name: ""
      password: ""
redis:
  enabled: false
  host: "127.0.0.1"
  port: 6379
  password: ""
  db: 0
  pool_size: 10
ai:
  enabled: true
  api_key: "your-api-key-here"
  api_endpoint: "https://api.openai.com/v1/chat/completions"
  default_model: "gpt-3.5-turbo"
  timeout: 30
  insecure_skip_verify: false
  use_toon_format: false
  headers: {}
  #  headers:
  #    X-API-Key: "your-custom-header"
# 证书配置示例
certificate:
  enabled: true
  default_algo: "RSA"  # 默认算法 (RSA/ECC/SM2)
  root_subject: "/CN=Example Root CA/O=Example Organization/OU=IT Department/C=CN/ST=Xinjiang/L=Urumqi"  # 根证书主题信息，使用/分割
  cert_path: "certs/generated"  # 证书存储路径
