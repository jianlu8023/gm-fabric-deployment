datasource:
  enabled: true
  data_source_type: sqlite3
  db_username: username
  db_password: password
  db_host: localhost
  db_port: 3306
  db_path: db/golang-example.db
  max_idle_conn: 10
  max_open_conn: 50
  log_in_console: true
docker:
  enabled: false
  host: tcp://192.168.58.110:2375
  default_timeout: 5
grpc:
  enabled: true
  node_id: "server-gm"
  health_check_interval: 60
  server:
    host: 0.0.0.0:65534
    max_recv_msg_size: 5242880
    max_send_msg_size: 5242880
    chunk_size: 4194304
    tls_enabled: true
    tls_gm: true
    tls_cert_file: [ "certs/tongsuo/server_sign.crt", "certs/tongsuo/server_enc.crt" ]
    tls_key_file: [ "certs/tongsuo/server_sign.key", "certs/tongsuo/server_enc.key" ]
    tls_rca_cert_file: "certs/tongsuo/subca.crt"
  clients:
    client-gm:
      host: 127.0.0.1:65533
      max_call_recv_msg_size: 5242880
      max_call_send_msg_size: 5242880
      chunk_size: 4194304
      call_timeout: 99999
      tls_enabled: true
      tls_gm: true
      tls_cert_file: [ "certs/tongsuo/client_sign.crt", "certs/tongsuo/client_enc.crt" ]
      tls_key_file: [ "certs/tongsuo/client_sign.key", "certs/tongsuo/client_enc.key" ]
      tls_rca_cert_file: "certs/tongsuo/subca.crt"
      tls_server_name: "grpc"
http:
  enabled: true
  address: :8080
  context_path: example
  run_mode: release
  tls_enabled: true
  tls_gm: true
  tls_gm_single_cert: false
  # gm模式需要两套 签名密钥,加密密钥
  #tls_key_file: "certs/tjfoc/sm2_sign_key.pem,certs/tjfoc/sm2_enc_key.pem"
  # gm模式需要两套 签名证书,加密证书
  #tls_cert_file: "certs/tjfoc/sm2_sign_cert.cer,certs/tjfoc/sm2_enc_cert.cer"
  #tls_rca_cert_file: certs/tjfoc/SM2_CA.cer
  tls_cert_file: [ "certs/tongsuo/server_sign.crt", "certs/tongsuo/server_enc.crt" ]
  tls_key_file: [ "certs/tongsuo/server_sign.key", "certs/tongsuo/server_enc.key" ]
  tls_rca_cert_file: "certs/tongsuo/subca.crt"
  http2_enabled: true  # 国密TLS模式不支持HTTP/2
  pprof: true
  language: "zh"  # 默认语言设置，支持zh,en
  upload_dir: "uploads"
  # panic恢复中间件配置
  # 建议始终启用recovery中间件，防止业务panic导致整个服务崩溃
  recovery:
    enabled: true                     # 是否启用recovery中间件，建议始终为true
    enable_stack: true                # 是否在日志中输出goroutine堆栈，生产环境建议false避免日志膨胀
    log_level: "error"                # panic日志级别：error | warn | fatal
    custom_message: ""                # 自定义响应消息，为空时使用默认"Server Internal Error"
  # IP白名单配置
  ip_white_list:
    enabled: false
    ips:
      - "127.0.0.1"
      - "192.168.1.0/24"
  # IP黑名单配置
  ip_black_list:
    enabled: false
    ips:
      - "10.0.0.1"
      - "172.16.0.0/16"
  # 可信代理配置：仅当请求的 RemoteAddr 命中以下网段时，才信任 X-Forwarded-For / X-Real-IP 头
  # 未启用时 GetClientIP 仅使用 RemoteAddr，可防止 XFF 头被伪造绕过 IP 黑白名单与限流
  # 部署在 Nginx/CDN 后方时，应将其网段填入此处
  trusted_proxies:
    enabled: false
    ips: [ "127.0.0.1", "192.168.0.0/16", "10.0.0.0/8" ]
  # 限流配置
  rate_limit:
    enabled: true
    rps: 100       # 每秒请求数限制
    burst: 200     # 令牌桶突发大小
    type: "juju"   # 限流实现类型：time, ulule, ants, custom, juju
  # CORS跨域配置
  # 安全约束：allow_origins 含 "*" 时 allow_credentials 必须为 false（W3C 规范）
  cors:
    enabled: true
    allow_origins:
      - "http://localhost:8080"
      - "http://127.0.0.1:8080"
      - "https://*.jianlu.site"
    allow_methods: [ "GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS" ]
    allow_headers: [ "Origin", "Content-Length", "Content-Type", "Authorization", "X-Requested-With" ]
    expose_headers: [ "Content-Length", "X-Request-Id" ]
    allow_credentials: true
    allow_wildcard: true
    max_age: 7200
  # 认证配置：编排 JWT 与 Session，由 auth 中间件统一处理
  # 生产环境必须将 jwt.secret 替换为高强度的随机字符串，禁止使用默认值
  auth:
    enabled: true                       # 总开关：是否启用认证
    token_source: "header"             # token 来源：header | cookie | query | auto
    token_header: "Authorization"      # token 头名称
    token_prefix: "Bearer"             # token 前缀
    sliding_expiration: true           # 滑动过期（每次访问续期）
    fresh_window: 300                  # 敏感操作二次校验窗口（秒）
    # JWT 子配置
    jwt:
      enabled: true                    # 是否启用 JWT
      secret: "gm-fabric-deployment-secret-please-change-in-production"  # JWT签名密钥，生产环境必须修改
      session_ttl: 86400               # 会话有效期（秒），默认86400（24小时）
    # Session 子配置
    session:
      enabled: true                    # 是否启用服务端会话
      ttl: 86400                       # 会话有效期（秒）
      cleanup_interval: 3600           # 过期清理间隔（秒），仅 memory 模式
      store_type: "memory"             # 存储类型：memory | redis
      sliding_expiration: true         # 滑动过期
  response_log:
    enabled: true
    max_body_bytes: 1024
    log_level: "debug"
libp2p:
  enabled: true
  listen_addr:
    - /ip4/0.0.0.0/tcp/2000
    - /ip6/::1/tcp/2000
    - /ip4/0.0.0.0/udp/2000/quic-v1
    - /ip4/127.0.0.1/udp/2000/quic-v1
    - /ip4/0.0.0.0/udp/2000/quic-v1/webtransport
    - /ip4/0.0.0.0/udp/2000/webrtc-direct
    - /dns4/localhost/udp/2000/ws
  identity:
    peer_id: 12D3KooWEeXfZpxfqwxFLJ2JYH21x85DnTMnCnmfUs4yQnCngM5T
    privkey: CAESQJY27DDSC9bEnAfcOE+rCLV6OVm/AETqUCt1swmR7HD9R8VdYQoGM7931nd+BX/URL1JLEGRvXX8IkGCK+boblo=
  protocol_id: /golang-example/msg/1.0.0
  service_tag: golang-example_tags
  bootstrap_list:
  #- "dns4/127.0.0.1/udp/2000/quic-v1/p2p/12D3KooWEmsdj6kGx8cpcjZWd4QG4bh4FZGuBEiUULWRgScyNHwe"
logger:
  default_log_level: debug
  stack_log_level: fatal
  print_format: console
  file_path: logs/app.log
  max_age: 7
  rotation_time: 1
  logger_level:
    grpc: debug
    libp2p: info
    main: info
captcha:
  enabled: true
  max_age: 300  # 验证码有效期5分钟
  width: 240    # 验证码图片宽度
  height: 80    # 验证码图片高度
  max_skew: 0.7 # 最大倾斜度
  dot_count: 20 # 干扰点数量
  line_count: 3 # 干扰线数量
  default_type: "number" # 默认验证码类型：string, number, math, chinese
ants_pool:
  enabled: true
  # 线程池大小
  pool_size: 8
  # 最大线程池
  max_pool_size: 16
  # 工作协程过期时间
  expiry_duration: 60
  # 是否预分配工作协程
  pre_alloc: true
  # 是否非阻塞模式
  nonblocking: true
mfa:
  enabled: true
  # google microsoft
  default_provider: "google"
  google:
    issuer: "golang-example"
  microsoft:
    tenant_id: ""
    client_id: ""
    client_secret: ""
tracer:
  enabled: true
  service_name: "example-server"
  log_in_console: true
  # tracer配置
  tracer:
    # file otlp stdout none  zipkin
    exporters: "file,none,otlp,"
    # grpc http/protobuf
    otel_protocol: "grpc"
    # grpc: https://127.0.0.1:4317/v1/traces || 127.0.0.1:4317
    # http/protobuf: 127.0.0.1:4318 ||
    otel_endpoint: "http://127.0.0.1:4317/v1/traces"
    otel_insecure: true
    # zipkin: http://localhost:9411/api/v2/spans
    zipkin_endpoint: ""
    file_path: "tracer.json"
  # logger配置
  logger:
    exporters: "file,none,,"
    otel_protocol: "grpc"
    otel_endpoint: "http://127.0.0.1:4317/v1/logs"
    otel_insecure: true
    file_path: "logger.json"
  # metrics配置
  metrics:
    exporters: "file,none,,"
    otel_protocol: "grpc"
    otel_endpoint: "http://127.0.0.1:4317/v1/metrics"
    otel_insecure: true
    file_path: "metrics.json"
kvdatabase:
  enabled: true
  # 数据库类型: leveldb, pebble, badger4
  db_type: "leveldb"
  db_path: "kvdatabase"
