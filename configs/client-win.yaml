datasource:
  enabled: false
  data_source_type: sqlite3
  db_username: username
  db_password: password
  db_host: localhost
  db_port: 3306
  db_path: db/golang-example.db
  max_idle_conn: 10
  max_open_conn: 50
  log_in_console: true
docker:
  enabled: false
  host: unix:///var/run/docker.sock
  default_timeout: 5
grpc:
  enabled: true
  server:
    host: 0.0.0.0:65533
    max_recv_msg_size: 5242880
    max_send_msg_size: 5242880
    chunk_size: 4194304
    tls_enabled: true
    tls_gm: true
    tls_cert_file: "certs/gmssl/sign.cert,certs/gmssl/encrypt.cert"
    tls_key_file: "certs/gmssl/sign.key,certs/gmssl/encrypt.key"
    tls_rca_cert_file: "certs/gmssl/ca.cert"
    #tls_cert_file: certs/normal/gserver.crt
    #tls_key_file: certs/normal/gserver.key
    #tls_rca_cert_file: certs/normal/root-ca.crt
  client:
    host: 127.0.0.1:65534
    max_call_recv_msg_size: 5242880
    max_call_send_msg_size: 5242880
    chunk_size: 4194304
    call_timeout: 99999
    tls_enabled: true
    tls_gm: true
    tls_cert_file: "certs/gmssl/sign.cert,certs/gmssl/encrypt.cert"
    tls_key_file: "certs/gmssl/sign.key,certs/gmssl/encrypt.key"
    tls_rca_cert_file: "certs/gmssl/ca.cert"
    #tls_cert_file: certs/normal/gclient.crt
    #tls_key_file: certs/normal/gclient.key
    #tls_rca_cert_file: certs/normal/root-ca.crt
http:
  enabled: false
  address: :8080
  context_path: example
  run_mode: release
  tls_enabled: true
  tls_cert_file: certs/normal/hserver.crt
  tls_key_file: certs/normal/hserver.key
  tls_rca_cert_file: certs/normal/root-ca.crt
  http2_enabled: true  # 启用HTTP/2支持
libp2p:
  enabled: true
  listen_addr:
    - /ip4/0.0.0.0/tcp/2001
    - /ip6/::1/tcp/2001
    - /ip4/0.0.0.0/udp/2001/quic-v1
    - /ip4/127.0.0.1/udp/2001/quic-v1
    - /ip4/0.0.0.0/udp/2001/quic-v1/webtransport
    - /ip4/0.0.0.0/udp/2001/webrtc-direct
    - /dns4/localhost/udp/2001/ws
  identity:
    peer_id: 12D3KooWB9vcdUVqj3doZb2mQtmrXfwRF4ZcrNtquA77PQqZGZci
    privkey: CAESQAi11XdBy0ogf7CgJNNicEk0mKM/2A9k7QtA1jmQW1RfE95o0U/gmG1RraWA38kdmHXExAkKFr0UgvowIYQ4Qa8=
  protocol_id: /golang-example/msg/1.0.0
  service_tag: golang-example_tags
  bootstrap_list:
  #- "dns4/127.0.0.1/udp/2000/quic-v1/p2p/12D3KooWEmsdj6kGx8cpcjZWd4QG4bh4FZGuBEiUULWRgScyNHwe"
logger:
  default_log_level: debug
  stack_log_level: fatal
  print_format: console
  file_path: logs/app.log
  max_age: 7
  rotation_time: 1
  logger_level:
    grpc: debug
    libp2p: debug
    main: debug
    docker: debug
ants_pool:
  enabled: true
  # 线程池大小
  pool_size: 8
  # 最大线程池
  max_pool_size: 16
  # 工作协程过期时间
  expiry_duration: 60
  # 是否预分配工作协程
  pre_alloc: true
  # 是否非阻塞模式
  nonblocking: true
mfa:
  enabled: true
  # google microsoft
  default_provider: "google"
  google:
    issuer: "golang-example"
  microsoft:
    tenant_id: ""
    client_id: ""
    client_secret: ""
tracer:
  enabled: true
  service_name: "example-client"
  log_in_console: true
  # tracer配置
  tracer:
    # file otlp stdout none  zipkin
    exporters: "file,none,otlp,"
    # grpc http/protobuf
    otel_protocol: "grpc"
    # grpc: https://127.0.0.1:4317/v1/traces || 127.0.0.1:4317
    # http/protobuf: 127.0.0.1:4318 ||
    otel_endpoint: "http://127.0.0.1:4317/v1/traces"
    otel_insecure: true
    # zipkin: http://localhost:9411/api/v2/spans
    zipkin_endpoint: ""
    file_path: "tracer.json"
  # logger配置
  logger:
    exporters: "file,none,otlp,"
    otel_protocol: "grpc"
    otel_endpoint: "http://127.0.0.1:4317/v1/logs"
    otel_insecure: true
    file_path: "logger.json"
  # meter配置
  meter:
    exporters: "file,none,otlp,"
    otel_protocol: "grpc"
    otel_endpoint: "http://127.0.0.1:4317/v1/metrics"
    otel_insecure: true
    file_path: "meter.json"
