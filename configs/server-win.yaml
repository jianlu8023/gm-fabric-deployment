datasource:
  enabled: true
  data_source_type: sqlite3
  db_username: username
  db_password: password
  db_host: localhost
  db_port: 3306
  db_path: db/golang-example.db
  max_idle_conn: 10
  max_open_conn: 50
  log_in_console: true
docker:
  enabled: false
  host: unix:///var/run/docker.sock
  default_timeout: 5
grpc:
  enabled: true
  server:
    host: 0.0.0.0:65534
    max_recv_msg_size: 5242880
    max_send_msg_size: 5242880
    chunk_size: 4194304
    tls_enabled: true
#    tls_gm: true
#    tls_cert_file: "certs/tongsuo/server_sign.crt,certs/tongsuo/server_enc.crt"
#    tls_key_file: "certs/tongsuo/server_sign.key,certs/tongsuo/server_enc.key"
#    tls_rca_cert_file: "certs/tongsuo/subca.crt"
    tls_gm: false
    tls_cert_file: [ certs/openssl/gserver-chain.crt ]
    tls_key_file: [ certs/openssl/gserver.key ]
    tls_rca_cert_file: certs/openssl/root.crt
  client:
    host: 127.0.0.1:65533
    max_call_recv_msg_size: 5242880
    max_call_send_msg_size: 5242880
    chunk_size: 4194304
    call_timeout: 99999
    tls_enabled: true
#    tls_gm: true
#    tls_cert_file: "certs/tongsuo/client_sign.crt,certs/tongsuo/client_enc.crt"
#    tls_key_file: "certs/tongsuo/client_sign.key,certs/tongsuo/client_enc.key"
#    tls_rca_cert_file: "certs/tongsuo/subca.crt"
#    tls_server_name: "grpc"
    tls_gm: false
    tls_cert_file: [ certs/openssl/gclient-chain.crt ]
    tls_key_file: [ certs/openssl/gclient.key ]
    tls_rca_cert_file: certs/openssl/root.crt
    tls_server_name: "gserver.jianlu.site"
http:
  enabled: true
  address: :8080
  context_path: example
  run_mode: release
  tls_enabled: true
  tls_gm: false
  tls_gm_single_cert: false
  tls_cert_file: [ certs/openssl/hserver-chain.crt ]
  tls_key_file: [ certs/openssl/hserver.key ]
  tls_rca_cert_file: certs/openssl/root.crt
  #tls_gm: true
  #tls_cert_file: "certs/tongsuo/client_sign.crt,certs/tongsuo/client_enc.crt"
  #tls_key_file: "certs/tongsuo/client_sign.key,certs/tongsuo/client_enc.key"
  #tls_rca_cert_file: "certs/tongsuo/subca.crt"
  http2_enabled: true  # 启用HTTP/2支持
  pprof: true
  language: "zh"  # 默认语言设置，支持zh,en
  upload_dir: "uploads"
  # panic恢复中间件配置
  # 建议始终启用recovery中间件，防止业务panic导致整个服务崩溃
  recovery:
    enabled: true                     # 是否启用recovery中间件，建议始终为true
    enable_stack: true                # 是否在日志中输出goroutine堆栈，生产环境建议false避免日志膨胀
    log_level: "error"                # panic日志级别：error | warn | fatal
    custom_message: ""                # 自定义响应消息，为空时使用默认"Server Internal Error"
  # IP白名单配置
  ip_white_list:
    enabled: false
    ips: [ "127.0.0.1", "192.168.1.0/24" ]
  # IP黑名单配置
  ip_black_list:
    enabled: true
    ips: [ "10.0.0.1", "172.16.0.0/16" ]
  # 可信代理配置：仅当请求的 RemoteAddr 命中以下网段时，才信任 X-Forwarded-For / X-Real-IP 头
  # 未启用时 GetClientIP 仅使用 RemoteAddr，可防止 XFF 头被伪造绕过 IP 黑白名单与限流
  # 部署在 Nginx/CDN 后方时，应将其网段填入此处
  trusted_proxies:
    enabled: false
    ips: [ "127.0.0.1", "192.168.0.0/16", "10.0.0.0/8" ]
  # 限流配置
  rate_limit:
    enabled: true
    rps: 100       # 每秒请求数限制
    burst: 200     # 令牌桶突发大小
    type: "juju"   # 限流实现类型：time, ulule, ants, custom, juju
  # CORS跨域配置
  # 安全约束：allow_origins 含 "*" 时 allow_credentials 必须为 false（W3C 规范）
  # 携带 Cookie 时必须使用显式 Origin 白名单或子域名通配符（allow_wildcard: true）
  cors:
    enabled: true
    allow_origins:
      - "http://localhost:8080"           # 开发环境前端
      - "http://127.0.0.1:8080"
      - "https://*.jianlu.site"           # 生产环境子域名，需配合 allow_wildcard: true
    allow_methods: [ "GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS" ]
    allow_headers: [ "Origin", "Content-Length", "Content-Type", "Authorization", "X-Requested-With" ]
    expose_headers: [ "Content-Length", "X-Request-Id" ]
    allow_credentials: true               # 携带 Cookie 时必须为 true，且 allow_origins 不可含 "*"
    allow_wildcard: true                  # 启用子域名通配符匹配
    max_age: 7200                         # 预检请求缓存时间（秒），2小时
  # 认证配置：编排 JWT 与 Session，由 auth 中间件统一处理
  # 生产环境必须将 jwt.secret 替换为高强度的随机字符串，禁止使用默认值
  auth:
    enabled: true                       # 总开关：是否启用认证
    token_source: "header"             # token 来源：header | cookie | query | auto
    token_header: "Authorization"      # token 头名称
    token_prefix: "Bearer"             # token 前缀
    sliding_expiration: true           # 滑动过期（每次访问续期）
    fresh_window: 300                  # 敏感操作二次校验窗口（秒）
    # JWT 子配置
    jwt:
      enabled: true                    # 是否启用 JWT
      secret: "gm-fabric-deployment-secret-please-change-in-production"  # JWT签名密钥，生产环境必须修改
      session_ttl: 86400               # 会话有效期（秒），默认86400（24小时）
    # Session 子配置
    session:
      enabled: true                    # 是否启用服务端会话
      ttl: 86400                       # 会话有效期（秒）
      cleanup_interval: 3600           # 过期清理间隔（秒），仅 memory 模式
      store_type: "memory"             # 存储类型：memory | redis
      sliding_expiration: true         # 滑动过期
  response_log:
    enabled: true
    max_body_bytes: 1024
    log_level: "debug"
# WebSocket配置
websocket:
  enabled: true                       # 是否启用WebSocket控制器
  ping_interval: 54s                  # 心跳ping发送间隔
  pong_wait: 60s                      # 等待pong超时时间，超时则断开连接
  write_wait: 10s                     # 单次写操作超时
  max_message_size: 4096              # 单帧最大消息字节数
  send_buffer_size: 256               # 每连接发送通道缓冲大小
  read_buffer_size: 1024              # 升级时读缓冲字节数
  write_buffer_size: 1024             # 升级时写缓冲字节数
  handshake_timeout: 10s              # 握手超时
  check_origins: [ ]                   # 允许的Origin列表，为空表示允许全部（仅开发环境建议为空，生产环境必须配置白名单）
libp2p:
  enabled: true
  listen_addr:
    - /ip4/0.0.0.0/tcp/2000
    - /ip6/::1/tcp/2000
    - /ip4/0.0.0.0/udp/2000/quic-v1
    - /ip4/127.0.0.1/udp/2000/quic-v1
    - /ip4/0.0.0.0/udp/2000/quic-v1/webtransport
    - /ip4/0.0.0.0/udp/2000/webrtc-direct
    - /dns4/localhost/udp/2000/ws
  identity:
    peer_id: 12D3KooWEeXfZpxfqwxFLJ2JYH21x85DnTMnCnmfUs4yQnCngM5T
    privkey: CAESQJY27DDSC9bEnAfcOE+rCLV6OVm/AETqUCt1swmR7HD9R8VdYQoGM7931nd+BX/URL1JLEGRvXX8IkGCK+boblo=
  protocol_id: /golang-example/msg/1.0.0
  service_tag: golang-example_tags
  health_check_interval: 60
  message_queue_size: 1024
  worker_count: 5
  broadcast_interval: 5
  dht_mode: server
  bootstrap_list:
  #- "dns4/127.0.0.1/udp/2000/quic-v1/p2p/12D3KooWEmsdj6kGx8pcjZWd4QG4bh4FZGuBEiUULWRgScyNHwe"
  persistence:
    enabled: false
    file_path: data/peerstore-server.json
    save_interval: 300
logger:
  default_log_level: debug
  stack_log_level: fatal
  print_format: console
  file_path: logs/app.log
  max_age: 7
  rotation_time: 1
  logger_level:
    grpc: debug
    libp2p: debug
    main: debug
    job: debug
    web: debug
    ants: debug
    control: debug
    ipfscluster: debug
    ipfs: debug
    datasource: debug
    websocket: debug
    tracer: debug
    captcha: debug
    kvdatabase: debug
    webrtc: debug
    mfa: debug
captcha:
  enabled: true
  max_age: 300  # 验证码有效期5分钟
  width: 240    # 验证码图片宽度
  height: 80    # 验证码图片高度
  max_skew: 0.7 # 最大倾斜度
  dot_count: 20 # 干扰点数量
  line_count: 3 # 干扰线数量
  default_type: "number" # 默认验证码类型：string, number, math, chinese
ants_pool:
  enabled: true
  # 线程池大小
  pool_size: 8
  # 最大线程池
  max_pool_size: 16
  # 工作协程过期时间
  expiry_duration: 60
  # 是否预分配工作协程
  pre_alloc: true
  # 是否非阻塞模式
  nonblocking: true
mfa:
  enabled: true
  # google microsoft
  default_provider: "google"
  google:
    issuer: "golang-example"
  microsoft:
    tenant_id: ""
    client_id: ""
    client_secret: ""
tracer:
  enabled: true
  service_name: "example-server"
  log_in_console: true
  # tracer配置
  tracer:
    # file otlp stdout none  zipkin
    exporters: "file,none,otlp,"
    # grpc http/protobuf
    otel_protocol: "grpc"
    # grpc: https://127.0.0.1:4317/v1/traces || 127.0.0.1:4317
    # http/protobuf: 127.0.0.1:4318 ||
    otel_endpoint: "http://127.0.0.1:4317/v1/traces"
    otel_insecure: true
    # zipkin: http://localhost:9411/api/v2/spans
    zipkin_endpoint: ""
    file_path: "tracer.json"
  # logger配置
  logger:
    exporters: "file,none,,"
    otel_protocol: "grpc"
    otel_endpoint: "http://127.0.0.1:4317/v1/logs"
    otel_insecure: true
    file_path: "logger.json"
  # metrics配置
  metrics:
    exporters: "file,none,,"
    otel_protocol: "grpc"
    otel_endpoint: "http://127.0.0.1:4317/v1/metrics"
    otel_insecure: true
    file_path: "metrics.json"
kvdatabase:
  enabled: true
  # 数据库类型: leveldb, pebble, badger4
  db_type: "leveldb"
  db_path: "kvdatabase"
webrtc:
  enabled: true
  #listen_addr: ""
  ice_servers:
    - url: "stun:192.168.58.110:3478"
      username: "tlrtcfile"
      password: "tlrtcfile"
    - url: "turn:192.168.58.110:3478?transport=udp"
      username: "tlrtcfile"
      password: "tlrtcfile"
  #max_message_size: 1
  min_port: 50000
  max_port: 65500
  log_in_console: true
ai:
  enabled: true
  api_key: "your-api-key-here"
  api_endpoint: "https://api.openai.com/v1/chat/completions"
  default_model: "gpt-3.5-turbo"
  timeout: 30
  insecure_skip_verify: false
  use_toon_format: false
  headers: {}
  #  headers:
  #    X-API-Key: "your-custom-header"
certificate:
  enabled: true
  # 默认算法 (RSA/ECC/SM2)
  default_algo: "SM2"
  # 根证书主题信息，使用/分割
  # C = countryName              : CN
  # ST = stateOrProvinceName     : Xinjiang
  # L = localityName             : Urumqi
  # O = organizationName         : Example Organization
  # OU = organizationalUnitName  : IT Department
  # CN = commonName              : Example Root CA
  # emailAddress = (未实现对此字段的解析)
  root_subject: "/CN=Example Root CA/O=Example Organization/OU=IT Department/C=CN/ST=Xinjiang/L=Urumqi"
  cert_path: "certs/generated"  # 证书存储路径
