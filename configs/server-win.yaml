datasource:
  enabled: true
  data_source_type: sqlite3
  db_username: username
  db_password: password
  db_host: localhost
  db_port: 3306
  db_path: db/golang-example.db
  max_idle_conn: 10
  max_open_conn: 50
  log_in_console: true
docker:
  enabled: false
  host: unix:///var/run/docker.sock
  default_timeout: 5
grpc:
  enabled: true
  server:
    host: 0.0.0.0:65534
    max_recv_msg_size: 5242880
    max_send_msg_size: 5242880
    chunk_size: 4194304
    tls_enabled: true
    tls_gm: false
    #tls_cert_file: "certs/tongsuo/server_sign.crt,certs/tongsuo/server_enc.crt"
    #tls_key_file: "certs/tongsuo/server_sign.key,certs/tongsuo/server_enc.key"
    #tls_rca_cert_file: "certs/tongsuo/subca.crt"
    tls_cert_file: certs/normal/gserver.crt
    tls_key_file: certs/normal/gserver.key
    tls_rca_cert_file: certs/normal/root-ca.crt
  client:
    host: 127.0.0.1:65533
    max_call_recv_msg_size: 5242880
    max_call_send_msg_size: 5242880
    chunk_size: 4194304
    call_timeout: 99999
    tls_enabled: true
    tls_gm: false
    #tls_cert_file: "certs/tongsuo/client_sign.crt,certs/tongsuo/client_enc.crt"
    #tls_key_file: "certs/tongsuo/client_sign.key,certs/tongsuo/client_enc.key"
    #tls_rca_cert_file: "certs/tongsuo/subca.crt"
    tls_cert_file: certs/normal/gclient.crt
    tls_key_file: certs/normal/gclient.key
    tls_rca_cert_file: certs/normal/root-ca.crt
http:
  enabled: true
  address: :8080
  context_path: example
  run_mode: release
  tls_enabled: true
  tls_cert_file: certs/normal/hserver.crt
  tls_key_file: certs/normal/hserver.key
  tls_rca_cert_file: certs/normal/root-ca.crt
  http2_enabled: true  # 启用HTTP/2支持
  pprof: true
  language: "zh"  # 默认语言设置，支持zh,en
  upload_dir: "uploads"
  # IP白名单配置
  ip_white_list:
    enabled: false
    ips: [ "127.0.0.1", "192.168.1.0/24" ]
  # IP黑名单配置
  ip_black_list:
    enabled: true
    ips: [ "10.0.0.1", "172.16.0.0/16" ]
  # 限流配置
  rate_limit:
    enabled: true
    rps: 100       # 每秒请求数限制
    burst: 200     # 令牌桶突发大小
    type: "juju"   # 限流实现类型：time, ulule, ants, custom, juju
libp2p:
  enabled: true
  listen_addr:
    - /ip4/0.0.0.0/tcp/2000
    - /ip6/::1/tcp/2000
    - /ip4/0.0.0.0/udp/2000/quic-v1
    - /ip4/127.0.0.1/udp/2000/quic-v1
    - /ip4/0.0.0.0/udp/2000/quic-v1/webtransport
    - /ip4/0.0.0.0/udp/2000/webrtc-direct
    - /dns4/localhost/udp/2000/ws
  identity:
    peer_id: 12D3KooWEeXfZpxfqwxFLJ2JYH21x85DnTMnCnmfUs4yQnCngM5T
    privkey: CAESQJY27DDSC9bEnAfcOE+rCLV6OVm/AETqUCt1swmR7HD9R8VdYQoGM7931nd+BX/URL1JLEGRvXX8IkGCK+boblo=
  protocol_id: /golang-example/msg/1.0.0
  service_tag: golang-example_tags
  bootstrap_list:
  #- "dns4/127.0.0.1/udp/2000/quic-v1/p2p/12D3KooWEmsdj6kGx8cpcjZWd4QG4bh4FZGuBEiUULWRgScyNHwe"
logger:
  default_log_level: debug
  stack_log_level: fatal
  print_format: console
  file_path: logs/app.log
  max_age: 7
  rotation_time: 1
  logger_level:
    grpc: debug
    libp2p: debug
    main: debug
    job: debug
    web: debug
    ants: debug
    control: debug
    ipfscluster: debug
    ipfs: debug
    datasource: debug
    websocket: debug
    tracer: debug
    captcha: debug
    kvdatabase: debug
    webrtc: debug
    mfa: debug
captcha:
  enabled: true
  max_age: 300  # 验证码有效期5分钟
  width: 240    # 验证码图片宽度
  height: 80    # 验证码图片高度
  max_skew: 0.7 # 最大倾斜度
  dot_count: 20 # 干扰点数量
  line_count: 3 # 干扰线数量
  default_type: "number" # 默认验证码类型：string, number, math, chinese
ants_pool:
  enabled: true
  # 线程池大小
  pool_size: 8
  # 最大线程池
  max_pool_size: 16
  # 工作协程过期时间
  expiry_duration: 60
  # 是否预分配工作协程
  pre_alloc: true
  # 是否非阻塞模式
  nonblocking: true
mfa:
  enabled: true
  # google microsoft
  default_provider: "google"
  google:
    issuer: "golang-example"
  microsoft:
    tenant_id: ""
    client_id: ""
    client_secret: ""
tracer:
  enabled: true
  service_name: "example-server"
  log_in_console: true
  # tracer配置
  tracer:
    # file otlp stdout none  zipkin
    exporters: "file,none,otlp,"
    # grpc http/protobuf
    otel_protocol: "grpc"
    # grpc: https://127.0.0.1:4317/v1/traces || 127.0.0.1:4317
    # http/protobuf: 127.0.0.1:4318 ||
    otel_endpoint: "http://127.0.0.1:4317/v1/traces"
    otel_insecure: true
    # zipkin: http://localhost:9411/api/v2/spans
    zipkin_endpoint: ""
    file_path: "tracer.json"
  # logger配置
  logger:
    exporters: "file,none,,"
    otel_protocol: "grpc"
    otel_endpoint: "http://127.0.0.1:4317/v1/logs"
    otel_insecure: true
    file_path: "logger.json"
  # meter配置
  meter:
    exporters: "file,none,,"
    otel_protocol: "grpc"
    otel_endpoint: "http://127.0.0.1:4317/v1/metrics"
    otel_insecure: true
    file_path: "meter.json"
kvdatabase:
  enabled: true
  # 数据库类型: leveldb, pebble, badger4
  db_type: "leveldb"
  db_path: "kvdatabase"
webrtc:
  enabled: true
  #listen_addr: ""
  ice_servers:
    - url: "stun:192.168.58.110:3478"
      username: "tlrtcfile"
      password: "tlrtcfile"
    - url: "turn:192.168.58.110:3478?transport=udp"
      username: "tlrtcfile"
      password: "tlrtcfile"
  #max_message_size: 1
  min_port: 50000
  max_port: 65500
  log_in_console: true
