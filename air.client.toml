# github https://github.com/air-verse/air
# Client 模式配置
# 启动方式：air -c air.client.toml

root = "."
tmp_dir = "tmp"

[build]
pre_cmd = []
# 构建 client 可执行文件
cmd = "go build -tags=jsoniter -o ./tmp/client.exe ./cmd/client"
post_cmd = []
bin = "tmp/client.exe"
# 启动参数：使用 client-win.yaml 配置
full_bin = "./tmp/client.exe -c configs/client-win.yaml -t win -d -v"
args_bin = []
include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml"]
exclude_dir = ["assets", "tmp", "vendor", "frontend/node_modules", "logs", "data", "db", "certs/generated"]
include_dir = []
include_file = []
exclude_file = []
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
follow_symlink = true
log = "air-client.log"
poll = false
poll_interval = 500
delay = 200
stop_on_error = true
send_interrupt = false
kill_delay = 500
rerun = false
rerun_delay = 500

[log]
time = true
main_only = false
silent = false

[color]
main    = "magenta"
watcher = "cyan"
build   = "yellow"
runner  = "green"

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = true
keep_scroll = true

[proxy]
# client 模式不需要 HTTP 代理（client-win.yaml 的 http.enabled=false）
enabled = false
proxy_port = 0
app_port   = 0

