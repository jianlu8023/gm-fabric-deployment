[req]
# 默认密钥长度，单位为 bit。推荐使用 4096 位或更高，以保证安全性。
default_bits = 4096
# 是否显示提示信息。设置为 no 可以避免交互式输入。
prompt = no
# 默认的消息摘要算法。SHA256 是一个安全的哈希算法。
default_md = sha256
# 证书请求的 DN (Distinguished Name) 定义。
distinguished_name = req_distinguished_name
# 证书请求的扩展。
req_extensions = v3_req

# 新的证书请求DN定义，更具描述性和灵活性
[req_distinguished_name]
# 国家代码 (2 个字母)。
countryName = Country Name (2 letter code)
countryName_default = CN
# 省份或州的名字。
stateOrProvinceName = State or Province Name (full name)
stateOrProvinceName_default = Xinjiang
# 城市的名字。
localityName = Locality Name (eg, city)
localityName_default = Urumqi
# 组织的名字 (例如，公司)。
organizationName = Organization Name (eg, company)
organizationName_default = My Company
# 组织单元的名字 (例如，部门)。
organizationalUnitName = Organizational Unit Name (eg, department)
organizationalUnitName_default = IT Department
# 通用名 (例如，完全限定的域名)。
commonName = Common Name (eg, fully qualified host name)
commonName_default = My Root CA # 注意：这里是为 CA 本身设置，如果是叶子证书，则应为 gRPC 服务的域名 (例如，grpc.example.com)。
# 通用名的最大长度。
commonName_max = 64
# 电子邮件地址。
emailAddress = Email Address
emailAddress_default = admin@example.com # 替换为您管理员的电子邮件地址，用于联系证书颁发机构。

[ca]
# 默认的 CA 配置节。
default_ca = CA_default

[CA_default]
# CA 的根目录。
dir = ./ca
# 证书数据库文件。
database = $dir/index.txt
# 新证书的存放目录。
new_certs_dir = $dir/certs
# CA 证书的路径。
certificate = $dir/cacert.pem
# 序列号文件。
serial = $dir/serial
# CA 私钥的路径。
private_key = $dir/private/cakey.pem
# 确保私钥长度与 default_bits 一致。
private_key_bits = 4096  # Add this line for clarity
# 证书的默认有效期，单位为天。
default_days = 3650
# 默认的消息摘要算法。
default_md = sha256
# 证书策略。
policy = policy_any

# 证书策略：允许任何值。
[policy_any]
countryName = optional
stateOrProvinceName = optional
localityName = optional
organizationName = optional
organizationalUnitName = optional
commonName = supplied
emailAddress = optional

# 严格的证书策略：只允许匹配的证书。
[policy_strict]
countryName             = optional
stateOrProvinceName     = optional
organizationName        = optional
organizationalUnitName  = optional
commonName              = supplied
emailAddress            = optional

# 宽松的证书策略：允许更广泛的证书。
[policy_loose]
countryName             = optional
stateOrProvinceName     = optional
localityName            = optional
organizationName        = optional
organizationalUnitName  = optional
commonName              = supplied
emailAddress            = optional

# CA 相关的 v3 扩展。
[v3_ca]
# 主题密钥标识符。
subjectKeyIdentifier = hash
# 授权密钥标识符。
authorityKeyIdentifier = keyid:always,issuer
# 基本约束。
# critical: 表示此扩展是关键的。
# CA:true: 表示此证书是一个 CA 证书。
# pathlen:0:  表示此 CA 只能签发叶子证书，不能签发其他 CA 证书。 如果根CA只签发叶子证书，可以添加 pathlen:0
basicConstraints = critical, CA:true, pathlen:0
# 密钥用途。
# cRLSign: 用于签名 CRL (证书吊销列表)。
# keyCertSign: 用于签名其他证书。
keyUsage = cRLSign, keyCertSign
# 添加 CRL 和 AIA (Authority Information Access)。
# crlDistributionPoints: CRL 的 URI。
crlDistributionPoints = URI:http://crl.yourcompany.com/ca.crl
# authorityInfoAccess: 提供 OCSP 和 CA 证书的 URI。
authorityInfoAccess = OCSP;URI:http://ocsp.yourcompany.com, CA;URI:http://crl.yourcompany.com/ca.crt

# 证书请求的 v3 扩展。
[v3_req]
# 基本约束。
# CA:FALSE: 表示此证书不是 CA 证书。
basicConstraints = CA:FALSE
# 密钥用途。
# digitalSignature: 用于数字签名。
# keyEncipherment: 用于密钥加密。
# nonRepudiation / contentCommitment： 用于防止抵赖。 如果设置了此标志，则密钥可以用于生成不可抵赖的签名，确保签名者不能否认他们对数据的签名。 通常用于电子合同、交易等场景。 nonRepudiation 和 contentCommitment 是同义词。
# dataEncipherment： 用于数据加密。 如果设置了此标志，则密钥可以用于直接加密数据。 相对较少使用，因为通常使用会话密钥来加密大量数据。
# keyAgreement： 用于密钥协商。 如果设置了此标志，则密钥可以用于密钥协商算法，例如 Diffie-Hellman。 通常用于建立安全的通信通道。
# keyCertSign： 用于签名证书。 如果设置了此标志，则密钥可以用于签名其他证书。 只有 CA 证书才应该设置此标志。
# cRLSign： 用于签名 CRL (证书吊销列表)。 如果设置了此标志，则密钥可以用于签名 CRL，以指示哪些证书已被吊销。
# 只有 CA 证书才应该设置此标志。
# encipherOnly： 仅用于加密。 与 keyAgreement 标志一起使用，表示密钥只能用于加密，不能用于解密。
# decipherOnly： 仅用于解密。 与 keyAgreement 标志一起使用，表示密钥只能用于解密，不能用于加密。
keyUsage = digitalSignature, keyEncipherment
# 扩展密钥用途。
# serverAuth: 用于服务器认证。
# clientAuth: 用于客户端认证。
# codeSigning:  用于代码签名。 如果设置了此标志，则表示该证书可以用于对软件代码进行数字签名，以验证代码的完整性和来源。 通常用于软件开发者发布软件时。
# emailProtection： 用于电子邮件保护。 如果设置了此标志，则表示该证书可以用于加密和签名电子邮件。 通常用于 S/MIME 协议。
# timeStamping： 用于时间戳服务。 如果设置了此标志，则表示该证书可以用于提供时间戳服务，以证明数据在特定时间点存在。
# OCSPSigning： 用于 OCSP (在线证书状态协议) 签名。 如果设置了此标志，则表示该证书可以用于签名 OCSP 响应，以验证证书的吊销状态。 通常用于 OCSP Responder 证书。
# anyExtendedKeyUsage： 表示证书可以用于任何扩展密钥用途。 不建议使用此标志，因为它会失去对密钥用途的控制。 除非有非常特殊的需求，否则应该避免使用 anyExtendedKeyUsage
extendedKeyUsage = serverAuth, clientAuth
# 主题备用名称 (Subject Alternative Name)。
# 用于指定证书可以用于哪些域名或 IP 地址。
subjectAltName = @alt_names

# 主题备用名称的定义。
[alt_names]
DNS.1 = grpc.example.com  # 替换为你的 gRPC 服务端主机名
IP.1 = 127.0.0.1  # 如果你的服务端使用 IP 地址，添加 IP 地址
# 可以添加更多的 DNS 或 IP 地址，例如：
# DNS.2 = another.example.com
# Email.1 = user@example.com  # 如果你的服务端使用电子邮件地址，添加电子邮件地址

[crl_ext]
authorityKeyIdentifier=keyid:always

[ocsp]
basicConstraints = CA:FALSE
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid,issuer
keyUsage = critical, digitalSignature
extendedKeyUsage = critical, OCSPSigning

[ v3_intermediate_ca ]
# Extensions for a typical intermediate CA (`man x509v3_config`).
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid:always,issuer
basicConstraints = critical, CA:true, pathlen:0
keyUsage = critical, digitalSignature, cRLSign, keyCertSign
